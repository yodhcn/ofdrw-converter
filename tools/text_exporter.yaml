identity:
  name: text_exporter
  author: ofdrw
  label:
    en_US: OFD to Text
    zh_Hans: OFD 转纯文本
description:
  human:
    en_US: Export an OFD (Open Fixed-layout Document) file to plain text using the OFDRW TextExporter. Returns the extracted text, document metadata, and optionally a downloadable .txt file.
    zh_Hans: 使用 OFDRW TextExporter 将 OFD（开放版式文档）文件导出为纯文本。返回提取到的文本、文档元信息，可选返回可下载的 .txt 文件。
  llm: Extract the plain text content of an OFD (Open Fixed-layout Document) file. Returns the extracted text plus metadata such as page count and character count, and optionally a downloadable .txt file. Note that some OFD pages are composed only of images or vector path data and therefore cannot yield any text.
parameters:
  - name: ofd_file
    type: file
    required: true
    label:
      en_US: OFD file
      zh_Hans: OFD 文件
    human_description:
      en_US: The OFD document to convert.
      zh_Hans: 待转换的 OFD 文档。
    llm_description: The OFD file to extract text from. It must be an .ofd document (an OFD file is a ZIP package).
    form: llm

  - name: pages
    type: string
    required: false
    label:
      en_US: Pages
      zh_Hans: 页码
    human_description:
      en_US: "Pages to export, 1-based. Supports lists and ranges, e.g. 1,3,5-7. Leave empty to export all pages."
      zh_Hans: "要导出的页码，从 1 开始，支持列表与区间，如 1,3,5-7。留空表示导出全部页。"
    llm_description: "Pages to export, 1-based, for example '1,3,5-7'. Leave empty to export the whole document."
    form: llm

  - name: attach_file
    type: boolean
    required: false
    default: false
    label:
      en_US: Attach .txt file
      zh_Hans: 附带 txt 文件
    human_description:
      en_US: Also return the full extracted text as a downloadable .txt file.
      zh_Hans: 同时把完整导出文本作为可下载的 .txt 文件返回。
    llm_description: Set to true to also return the full extracted text as a downloadable .txt file.
    form: form

  - name: max_chars
    type: number
    required: false
    default: 0
    min: 0
    label:
      en_US: Max characters
      zh_Hans: 最大字符数
    human_description:
      en_US: Truncate the text message to this many characters. 0 means no limit.
      zh_Hans: 文本消息截断到该字符数，0 表示不限制。
    llm_description: Maximum number of characters returned in the text output. Use 0 for no limit.
    form: form
extra:
  python:
    source: tools/text_exporter.py
