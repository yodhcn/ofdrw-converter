identity:
  name: text_exporter
  author: ofdrw
  label:
    en_US: OFD to Text
    zh_Hans: OFD 转纯文本
description:
  human:
    en_US: Export an OFD (Open Fixed-layout Document) file to plain text using the OFDRW library. By default the text is re-laid out from the page coordinates, so text runs that were split into many tiny objects are merged back into readable lines. Returns the extracted text, document metadata, and optionally a downloadable .txt file.
    zh_Hans: 将 OFD（开放版式文档）文件导出为纯文本（基于 OFDRW）。默认按版面坐标还原阅读顺序，把被拆散成大量短碎片的文字重新合并成可读的行。返回提取到的文本、文档元信息，可选返回可下载的 .txt 文件。
  llm: Extract the plain text content of an OFD (Open Fixed-layout Document) file. The text is reconstructed from the page coordinates so that lines read in normal order. Returns the extracted text plus metadata such as page count and character count, and optionally a downloadable .txt file. Note that some OFD pages are composed only of images or vector path data and therefore cannot yield any text.
parameters:
  - name: ofd_file
    type: file
    required: true
    label:
      en_US: OFD file
      zh_Hans: OFD 文件
    human_description:
      en_US: The OFD document to convert.
      zh_Hans: 待转换的 OFD 文档。
    llm_description: The OFD file to extract text from. It must be an .ofd document (an OFD file is a ZIP package).
    form: llm

  - name: pages
    type: string
    required: false
    label:
      en_US: Pages
      zh_Hans: 页码
    human_description:
      en_US: "Pages to export, 1-based. Supports lists and ranges, e.g. 1,3,5-7. Leave empty to export all pages."
      zh_Hans: "要导出的页码，从 1 开始，支持列表与区间，如 1,3,5-7。留空表示导出全部页。"
    llm_description: "Pages to export, 1-based, for example '1,3,5-7'. Leave empty to export the whole document."
    form: llm

  - name: mode
    type: select
    required: false
    default: layout
    options:
      - value: layout
        label:
          en_US: Rebuild layout (recommended)
          zh_Hans: 按版面重排（推荐）
      - value: raw
        label:
          en_US: Raw text runs
          zh_Hans: 原始文本块
    label:
      en_US: Extraction mode
      zh_Hans: 抽取模式
    human_description:
      en_US: "Rebuild layout sorts and merges text by its page coordinates, giving lines that read in normal order. Raw text runs keeps the original behaviour: every text run in the file becomes its own line, which is useful for troubleshooting."
      zh_Hans: "按版面重排会依据文字在页面上的坐标排序与合并，输出接近人工阅读的分行；原始文本块保留旧行为——文件里每个文本块各自占一行，便于排查问题。"
    llm_description: "Text extraction mode: 'layout' rebuilds lines from page coordinates (default), 'raw' emits every text run on its own line."
    form: form

  - name: attach_file
    type: boolean
    required: false
    default: false
    label:
      en_US: Attach .txt file
      zh_Hans: 附带 txt 文件
    human_description:
      en_US: Also return the full extracted text as a downloadable .txt file.
      zh_Hans: 同时把完整导出文本作为可下载的 .txt 文件返回。
    llm_description: Set to true to also return the full extracted text as a downloadable .txt file.
    form: form

  - name: max_chars
    type: number
    required: false
    default: 0
    min: 0
    label:
      en_US: Max characters
      zh_Hans: 最大字符数
    human_description:
      en_US: Truncate the text message to this many characters. 0 means no limit.
      zh_Hans: 文本消息截断到该字符数，0 表示不限制。
    llm_description: Maximum number of characters returned in the text output. Use 0 for no limit.
    form: form
extra:
  python:
    source: tools/text_exporter.py
